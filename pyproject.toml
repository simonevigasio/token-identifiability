[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-identifiability-elf"
version = "0.1.0"
description = "Token identifiability (Brunner et al., ICLR 2020, Sec. 4) reproduced for T5 encoders and ELF-B"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.45,<5",
    "huggingface-hub>=0.25,<1",
    "datasets>=2.19",
    "sentencepiece>=0.2",
    "einops>=0.7",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["tokid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
